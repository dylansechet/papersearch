name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-webui:
    name: Build Web UI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web UI deps
        run: npm ci
        working-directory: webui

      - name: Build web UI
        run: npm run build
        working-directory: webui

      - name: Upload web UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: webui
          path: webui/dist

  build-binaries:
    name: Build Binaries
    runs-on: ${{ matrix.os }}
    needs: build-webui
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download web UI artifact
        uses: actions/download-artifact@v4
        with:
          name: webui
          path: webui/dist

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true
          target: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p upload
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            mv target/${{ matrix.target }}/release/papersearch.exe upload/papersearch-${{ github.ref_name }}-${{ matrix.name }}.exe
          else
            mv target/${{ matrix.target }}/release/papersearch upload/papersearch-${{ github.ref_name }}-${{ matrix.name }}
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: papersearch-${{ matrix.name }}
          path: upload/papersearch*


  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: write
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: papersearch-*
          merge-multiple: true
          path: ./binaries

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./binaries/*
          generate_release_notes: true
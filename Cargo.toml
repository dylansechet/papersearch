[package]
name = "papersearch"
version = "0.2.1"
edition = "2021"

[profile.release]
lto = true
codegen-units = 1
strip = true


[dependencies]
clap = { version = "4.4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
url = "2.5"
thiserror = "1.0"
once_cell = "1.19"
backoff = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = "8.10"
tiny_http = "0.12"
webbrowser = "1.0"
mime_guess = "2.0"
urlencoding = "2.1"
